version: 2
project_name: kamaleon

builds:
  - main: ./kml.go
    binary: kml
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

# Esto genera el "binario normal" comprimido en un tar.gz
archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Esto genera los paquetes .deb y .rpm
nfpms:
  - maintainer: AnabasaSoft <anabasasoft@gmail.com>
    description: "Universal wrapper for: yay, paru, pacman, apt, dnf, zypper, apk, flatpak and xbps."
    homepage: https://github.com/AnabasaSoft/Kamaleon
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: _kml
        dst: /usr/share/zsh/site-functions/_kml
      - src: kml-completion.bash
        dst: /usr/share/bash-completion/completions/kml
      - src: LICENSE
        dst: /usr/share/licenses/kamaleon/LICENSE

# Evita crear la release de GitHub si el código está sucio
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'